name: 每日資料蒐集與AI分析

on:
  schedule:
    # 2026-07-24 精簡：一天只留「收盤後」兩次，開盤前交給 daily_advice.yml
    # （原本一天 6 次，盤中那幾次拿掉，Gemini API 費用同步下降）
    # 台灣時間 15:00 台股收盤（UTC 07:00）
    - cron: '0 7 * * *'
    # 台灣時間 05:00 美股收盤後 ~5PM ET（UTC 前日 21:00）
    - cron: '0 21 * * *'
  workflow_dispatch:  # 手動觸發

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: 收集新聞資料
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/collect_data.py

      - name: AI 分析（今日特別關注）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/analyze.py

      - name: VIP 投資動向追蹤
        run: python scripts/collect_vip_moves.py

      - name: Commit & Push
        run: |
          git config user.name  "investment-radar-bot"
          git config user.email "bot@investment-radar"
          git add data/reports/ data/vip_moves.json
          git diff --staged --quiet || git commit -m "📊 每日更新 $(date '+%Y-%m-%d') — 含AI分析+VIP動向"
          git push
